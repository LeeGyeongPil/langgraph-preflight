# No API keys, no network calls from the tests: sample nodes are plain functions.
# Job 1 runs the locked langgraph (1.2.21) on three OSes; job 2 upgrades to the
# newest langgraph <2 because the tool reads LangGraph internals.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch new langgraph releases that change internals
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, locked langgraph)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - name: first run (expects LP001 and exit code 1)
        shell: bash
        run: |
          set +e
          uv run --locked langgraph-preflight samples/fanout_conflict.py:graph
          code=$?
          test "$code" -eq 1
      - name: clean sample passes
        run: uv run --locked langgraph-preflight samples/clean_agent.py:graph

  latest-langgraph:
    name: test (ubuntu, newest langgraph <2)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv pip install --upgrade "langgraph>=1.2.21,<2"
      - run: uv pip show langgraph
      - run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
