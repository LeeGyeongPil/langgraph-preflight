name: 버그 / Bug
description: 실행했더니 기대와 다르게 동작해요 / Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 일어났나요? / What happened?
      description: 실행한 명령과 나온 메시지를 그대로 붙여 주세요. / Paste the command and the output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 / Expected
  - type: input
    id: env
    attributes:
      label: 환경 / Environment
      placeholder: "macOS / Ubuntu / Windows · Python 3.12 · uv 0.x · langgraph 1.2.x · langgraph-preflight 0.1.0"
    validations:
      required: true
